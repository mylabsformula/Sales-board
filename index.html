<html lang="ko">

<title>세일즈 정산 보드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6fb;color:#1a1a2e;font-size:13px;}

.header{background:linear-gradient(135deg,#1e2d5a,#2d4a8a);color:#fff;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:15px;font-weight:700;}
.rate-chip{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 9px;font-weight:700;font-size:11px;}
.rate-src{font-size:10px;opacity:.7;}

.period-bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:7px 18px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.period-label{font-size:10px;font-weight:600;color:#9ca3af;}
.pill{padding:2px 10px;border-radius:20px;border:1px solid #e5e7eb;font-size:11px;font-weight:600;cursor:pointer;color:#6b7280;white-space:nowrap;}
.pill:hover{border-color:#2d4a8a;color:#2d4a8a;}
.pill.active{background:#1e2d5a;color:#fff;border-color:#1e2d5a;}
.pill .cnt{opacity:.6;font-size:10px;}

/* P&L flow strip */
.flow-strip{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid #e5e7eb;}
.flow-item{flex:1;text-align:center;padding:10px 6px;border-right:1px solid #f3f4f6;min-width:0;}
.flow-item:last-child{border-right:none;}
.flow-item .fl{font-size:9px;color:#9ca3af;margin-bottom:2px;white-space:nowrap;}
.flow-item .fv{font-size:14px;font-weight:800;color:#1e2d5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flow-item .fs{font-size:9px;color:#b0b7c3;margin-top:1px;}
.flow-item.orange .fv{color:#d97706;}
.flow-item.red .fv{color:#dc2626;}
.flow-item.green .fv{color:#059669;}

/* Brand summary */
.brand-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 18px;}
.brand-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;}
.bc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.bc-name{font-size:12px;font-weight:700;color:#1e2d5a;}
.bc-mar{font-size:15px;font-weight:800;color:#059669;}
.bc-pct{font-size:10px;color:#9ca3af;margin-left:3px;}
.bc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.bc-stat{background:#f9fafb;border-radius:5px;padding:4px 6px;text-align:center;}
.bc-stat .l{font-size:9px;color:#9ca3af;}
.bc-stat .v{font-size:11px;font-weight:700;color:#374151;}
.bc-stat.orange .v{color:#d97706;}
.bc-stat.red .v{color:#dc2626;}

/* Tabs */
.main-wrap{padding:0 18px 20px;}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid #f3f4f6;overflow-x:auto;}
.tab{padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer;color:#9ca3af;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;}
.tab.active{color:#1e2d5a;border-bottom-color:#1e2d5a;}
.tab-body{display:none;padding:14px 16px;}
.tab-body.active{display:block;}

/* Section block */
.sec-block{margin-bottom:16px;}
.sec-block:last-child{margin-bottom:0;}

/* Section header with mini P&L */
.sec-head{border-radius:8px 8px 0 0;padding:9px 12px;border:1px solid #e5e7eb;border-bottom:none;}
.sec-head.blue{background:linear-gradient(90deg,#eff6ff,#f8faff);border-color:#bfdbfe;}
.sec-head.purple{background:linear-gradient(90deg,#faf5ff,#f5f3ff);border-color:#e9d5ff;}
.sec-head.blue-light{background:linear-gradient(90deg,#f0f9ff,#f8faff);border-color:#bae6fd;}
.sec-head.purple-light{background:linear-gradient(90deg,#fdf4ff,#faf5ff);border-color:#f0abfc;}
.sh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sh-title{font-size:13px;font-weight:700;}
.sh-title.blue{color:#1d4ed8;}
.sh-title.purple{color:#5b21b6;}
.sh-mar{font-size:15px;font-weight:800;color:#059669;}
.sh-pct{font-size:11px;color:#9ca3af;margin-left:4px;font-weight:400;}

/* Mini flow inside section */
.mini-flow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.mf-chip{font-size:11px;font-weight:600;background:rgba(255,255,255,.8);border:1px solid #e5e7eb;border-radius:5px;padding:2px 8px;white-space:nowrap;}
.mf-chip .mv{font-weight:700;}
.mf-chip.orange .mv{color:#d97706;}
.mf-chip.red .mv{color:#dc2626;}
.mf-chip.green .mv{color:#059669;}
.mf-arrow{color:#d1d5db;font-size:11px;flex-shrink:0;}

/* Pharmacist sub-card */
.ph-card{border:1px solid #e9d5ff;border-radius:0 0 8px 8px;overflow:hidden;}
.ph-sub-head{background:#faf5ff;padding:7px 12px;border-bottom:1px solid #e9d5ff;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ph-label{font-size:11px;font-weight:700;color:#5b21b6;}

/* Table container */
.tbl-wrap{border:1px solid #e5e7eb;border-radius:0 0 8px 8px;overflow:hidden;}
.tbl-wrap.ph{border-color:#e9d5ff;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;color:#9ca3af;padding:6px 10px;border-bottom:1px solid #f3f4f6;text-align:right;white-space:nowrap;background:#fafafa;}
th.left{text-align:left;}
td{padding:7px 10px;border-bottom:1px solid #f9fafb;font-size:12px;text-align:right;vertical-align:middle;}
td.left{text-align:left;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}
.total-row td{font-weight:700;background:#f9fafb;border-top:1px solid #e9ecef;}

.tag{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700;}
.tag-ml{background:#dbeafe;color:#1e40af;}
.tag-ydy{background:#ede9fe;color:#5b21b6;}
.tag-smart{background:#dcfce7;color:#166534;}
.tag-cp{background:#fee2e2;color:#b91c1c;}
.tag-11st{background:#fef9c3;color:#854d0e;}

.bar-wrap{display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.bar-bg{width:40px;height:4px;background:#f3f4f6;border-radius:2px;overflow:hidden;flex-shrink:0;}
.bar-fill{height:100%;border-radius:2px;}
.pv{font-size:11px;font-weight:700;min-width:36px;text-align:right;}

.green{color:#059669;}.red{color:#dc2626;}.orange{color:#d97706;}.gray{color:#9ca3af;}.bold{font-weight:700;}
.warn{background:#fef3c7;border-left:3px solid #fcd34d;padding:6px 10px;font-size:11px;color:#92400e;margin-top:0;}

.cost-scroll{overflow-x:auto;}
.est-badge{display:inline-block;font-size:9px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:3px;padding:0 4px;margin-left:3px;vertical-align:middle;}
.comm-note{background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:8px 12px;font-size:11px;color:#78350f;margin-bottom:12px;line-height:1.6;}
.footer{text-align:center;font-size:10px;color:#d1d5db;padding:10px;}

let RATE=1506.83, rateSrc="캐시", selPeriod="all";

function loadExtra(){try{return JSON.parse(localStorage.getItem(LS))||[];}catch{return[];}}
function allOrders(){return[...PERIODS_DATA.flatMap(p=>p.orders.map(o=>({...o,period:p.id}))),...loadExtra().flatMap(p=>p.orders.map(o=>({...o,period:p.id})))];}

function filtered(){const a=allOrders();return selPeriod==="all"?a:a.filter(o=>o.period===selPeriod);}
function calc(arr){return arr.map(o=>({...o,cost_krw:o.cost_usd*RATE*o.qty,commission:o.sales-o.settlement,margin:o.settlement-o.cost_usd*RATE*o.qty}));}

// ── Utils ─────────────────────────────────────────────────────────────────────
const fmt =n=>"₩"+Math.round(n).toLocaleString("ko-KR");
const man =n=>"₩"+(Math.round(n/10000)).toLocaleString("ko-KR")+"만";
const pct =n=>(n*100).toFixed(1)+"%";
const bclr=p=>p>.6?"#059669":p>.3?"#2563eb":p>.1?"#d97706":"#dc2626";
const tagMap={"스마트스토어":"tag-smart","쿠팡":"tag-cp","11번가":"tag-11st"};
const sum=(arr,k)=>arr.reduce((s,o)=>s+(o[k]||0),0);

// ── Rate ──────────────────────────────────────────────────────────────────────
async function fetchRate(){
  try{const d=await(await fetch("https://api.exchangerate-api.com/v4/latest/USD")).json();RATE=d.rates.KRW;rateSrc=d.date+" 기준";}
  catch{try{const d=await(await fetch("https://open.er-api.com/v6/latest/USD")).json();RATE=d.rates.KRW;rateSrc="실시간";}catch{}}
  renderAll();
}

// ── Pills ─────────────────────────────────────────────────────────────────────
function renderPills(){
  const orders=allOrders(),tq=sum(orders,"qty");
  let h=`<span class="pill ${selPeriod==="all"?"active":""}" onclick="setPeriod('all')">전체 <span class="cnt">${tq}건</span></span>`;
  allPeriods().forEach(p=>{const q=sum(orders.filter(o=>o.period===p.id),"qty");h+=`<span class="pill ${selPeriod===p.id?"active":""}" onclick="setPeriod('${p.id}')">${p.label} <span class="cnt">${q}건</span></span>`;});
  document.getElementById("period-pills").innerHTML=h;
}
function setPeriod(id){selPeriod=id;renderPills();renderAll();}

// ── Main render ───────────────────────────────────────────────────────────────
function renderAll(){
  const data=calc(filtered());
  const tq=sum(data,"qty"),ts=sum(data,"sales"),tc=sum(data,"commission"),tset=sum(data,"settlement"),tcost=sum(data,"cost_krw"),tmar=sum(data,"margin");

  document.getElementById("rate-chip").textContent=`$1 = ₩${RATE.toFixed(0)}`;
  document.getElementById("rate-src").textContent=rateSrc;
  document.getElementById("cost-rate").textContent=`$1 = ₩${RATE.toFixed(0)}`;
  document.getElementById("f-orders").textContent=tq+"건";
  document.getElementById("f-periods").textContent=allPeriods().length+"개 기간";
  document.getElementById("f-sales").textContent=fmt(ts);
  document.getElementById("f-comm").textContent=fmt(tc);
  document.getElementById("f-comm-pct").textContent=ts>0?pct(tc/ts):"—";
  document.getElementById("f-set").textContent=fmt(tset);
  document.getElementById("f-cost").textContent=fmt(tcost);
  document.getElementById("f-rate").textContent=`@${RATE.toFixed(0)}`;
  document.getElementById("f-margin").textContent=fmt(tmar);
  document.getElementById("f-mpct").textContent=tset>0?`마진율 ${pct(tmar/tset)}`:"—";

  ["Mylabs","YDY"].forEach(b=>{
    const bd=data.filter(o=>o.brand===b);
    const bset=sum(bd,"settlement"),bmar=sum(bd,"margin"),bcomm=sum(bd,"commission"),bcost=sum(bd,"cost_krw"),bq=sum(bd,"qty");
    const pfx=b==="Mylabs"?"bc-ml":"bc-ydy";
    document.getElementById(pfx+"-mar").textContent=fmt(bmar);
    document.getElementById(pfx+"-pct").textContent=bset>0?` (${pct(bmar/bset)})`:"";
    document.getElementById(pfx+"-qty").textContent=bq+"건";
    document.getElementById(pfx+"-comm").textContent=man(bcomm);
    document.getElementById(pfx+"-cost").textContent=man(bcost);
  });

  // 채널별 요약
  renderChannelSummary(data);

  // 전체 요약: YDY공구 → YDY상시 → Mylabs공구 → Mylabs상시
  renderSection(data,"YDY","공구","total-ydy-gonggu");
  renderSection(data,"YDY","상시","total-ydy-sansi");
  renderSection(data,"Mylabs","공구","total-ml-gonggu");
  renderSection(data,"Mylabs","상시","total-ml-sansi");
  // 브랜드 탭
  renderSection(data,"Mylabs","공구","ml-gonggu");
  renderSection(data,"Mylabs","상시","ml-sansi");
  renderSection(data,"YDY","공구","ydy-gonggu");
  renderSection(data,"YDY","상시","ydy-sansi");

  renderCosts();
  document.getElementById("footer").textContent=`${new Date().toLocaleString("ko-KR")} 기준 · 환율 ${rateSrc} · ${allPeriods().length}개 기간`;
}

// ── Channel summary ───────────────────────────────────────────────────────────
function renderChannelSummary(data) {
  const ch = {};
  const ORDER = ["스마트스토어","쿠팡","11번가"];
  data.forEach(o => {
    if(!ch[o.channel]) ch[o.channel]={qty:0,sales:0,commission:0,settlement:0,cost:0,margin:0,hasEst:false};
    ch[o.channel].qty        += o.qty;
    ch[o.channel].sales      += o.sales;
    ch[o.channel].commission += o.commission;
    ch[o.channel].settlement += o.settlement;
    ch[o.channel].cost       += o.cost_krw;
    ch[o.channel].margin     += o.margin;
    if(o.comm_basis==="est") ch[o.channel].hasEst=true;
  });

  const channels = ORDER.filter(c=>ch[c]).concat(Object.keys(ch).filter(c=>!ORDER.includes(c)));
  let rows="";
  let tot={qty:0,sales:0,commission:0,settlement:0,cost:0,margin:0};

  for(const c of channels){
    const v=ch[c];
    const mp=v.settlement>0?v.margin/v.settlement:0;
    const cp=v.sales>0?v.commission/v.sales:0;
    const estBadge=v.hasEst?`<span class="est-badge">추정</span>`:"";
    rows+=`<tr>
      <td class="left"><span class="tag ${tagMap[c]||""}">${c}</span></td>
      <td>${v.qty}건</td>
      <td>${fmt(v.sales)}</td>
      <td class="orange">▼${fmt(v.commission)} <span class="gray" style="font-size:10px">(${pct(cp)})</span>${estBadge}</td>
      <td>${fmt(v.settlement)}</td>
      <td class="red">▼${fmt(v.cost)}</td>
      <td class="green bold">${fmt(v.margin)}</td>
      <td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${Math.max(0,mp*100)}%;background:${bclr(mp)}"></div></div><span class="pv" style="color:${bclr(mp)}">${pct(mp)}</span></div></td>
    </tr>`;
    tot.qty+=v.qty; tot.sales+=v.sales; tot.commission+=v.commission;
    tot.settlement+=v.settlement; tot.cost+=v.cost; tot.margin+=v.margin;
  }
  const totp=tot.settlement>0?tot.margin/tot.settlement:0;
  const totcp=tot.sales>0?tot.commission/tot.sales:0;
  rows+=`<tr class="total-row">
    <td class="left">합계</td>
    <td>${tot.qty}건</td>
    <td>${fmt(tot.sales)}</td>
    <td class="orange">▼${fmt(tot.commission)} <span class="gray" style="font-size:10px">(${pct(totcp)})</span></td>
    <td>${fmt(tot.settlement)}</td>
    <td class="red">▼${fmt(tot.cost)}</td>
    <td class="green">${fmt(tot.margin)}</td>
    <td class="green">${pct(totp)}</td>
  </tr>`;

  document.getElementById("channel-summary").innerHTML=`
  <div class="sec-block">
    <div class="sec-head" style="background:#f8faff;border-color:#c7d7f7;">
      <div class="sh-top">
        <span class="sh-title" style="color:#1e40af;">📦 채널별 정산 요약</span>
        <span class="gray" style="font-size:11px;">스마트스토어 실제값 · 쿠팡/11번가 수수료 추정</span>
      </div>
    </div>
    <div class="tbl-wrap" style="border-color:#c7d7f7;">
      <table>
        <thead><tr>
          <th class="left">채널</th>
          <th>건수</th>
          <th>매출</th>
          <th>수수료 (비율)</th>
          <th>정산금액</th>
          <th>원가+배송</th>
          <th>순마진</th>
          <th>마진율</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Section renderer (공통) ───────────────────────────────────────────────────
function renderSection(data, brand, type, targetId) {
  const sData = data.filter(o=>o.brand===brand && o.type===type);
  const el = document.getElementById(targetId);
  if(!sData.length){el.innerHTML="";return;}

  const sq=sum(sData,"qty"),ss=sum(sData,"sales"),sc=sum(sData,"commission"),sset=sum(sData,"settlement"),scost=sum(sData,"cost_krw"),smar=sum(sData,"margin");
  const smp=sset>0?smar/sset:0;
  const isBlue=brand==="Mylabs";
  const colorCls=type==="공구"?(isBlue?"blue":"purple"):(isBlue?"blue-light":"purple-light");
  const titleCls=isBlue?"blue":"purple";
  const emoji=type==="공구"?"💊":"🏪";
  const label=`${brand} ${type}`;

  // Mini flow
  const miniFlow=`
    <div class="mini-flow">
      <span class="mf-chip">${sq}건</span>
      <span class="mf-arrow">·</span>
      <span class="mf-chip">매출 <span class="mv">${man(ss)}</span></span>
      <span class="mf-arrow">−</span>
      <span class="mf-chip orange">수수료 <span class="mv">▼${man(sc)}</span><span style="color:#9ca3af;font-size:10px"> (${ss>0?pct(sc/ss):"—"})</span></span>
      <span class="mf-arrow">=</span>
      <span class="mf-chip">정산 <span class="mv">${man(sset)}</span></span>
      <span class="mf-arrow">−</span>
      <span class="mf-chip red">원가 <span class="mv">▼${man(scost)}</span></span>
      <span class="mf-arrow">=</span>
      <span class="mf-chip green">순마진 <span class="mv">${fmt(smar)}</span></span>
    </div>`;

  let tableHtml="";
  if(type==="공구"){
    tableHtml = buildGongguTable(sData, brand);
  } else {
    tableHtml = buildSansiTable(sData);
  }

  el.innerHTML=`
  <div class="sec-block">
    <div class="sec-head ${colorCls}">
      <div class="sh-top">
        <span class="sh-title ${titleCls}">${emoji} ${label}</span>
        <span><span class="sh-mar">${fmt(smar)}</span><span class="sh-pct">(${pct(smp)})</span></span>
      </div>
      ${miniFlow}
    </div>
    ${tableHtml}
  </div>`;
}

// ── 공구 테이블 (약사별 그룹) ─────────────────────────────────────────────────
function buildGongguTable(sData, brand) {
  const pharmacists=[...new Set(sData.map(o=>o.pharmacist||"미분류"))];
  let html="";

  for(const ph of pharmacists){
    const phD=sData.filter(o=>(o.pharmacist||"미분류")===ph);
    const phQ=sum(phD,"qty"),phS=sum(phD,"sales"),phC=sum(phD,"commission"),phSet=sum(phD,"settlement"),phCost=sum(phD,"cost_krw"),phM=sum(phD,"margin");
    const phMp=phSet>0?phM/phSet:0;

    // 상품별 행
    const prods={};
    phD.forEach(o=>{
      if(!prods[o.label]) prods[o.label]={label:o.label,qty:0,sales:0,commission:0,settlement:0,cost_usd:o.cost_usd,cost_krw:0,margin:0};
      prods[o.label].qty+=o.qty;prods[o.label].sales+=o.sales;prods[o.label].commission+=o.commission;
      prods[o.label].settlement+=o.settlement;prods[o.label].cost_krw+=o.cost_krw;prods[o.label].margin+=o.margin;
    });

    let rows="";
    for(const p of Object.values(prods)){
      const puSet=p.settlement/p.qty,puCost=p.cost_usd*RATE,puMar=puSet-puCost,mp=puSet>0?puMar/puSet:0;
      rows+=`<tr>
        <td class="left">${p.label}</td>
        <td>${p.qty}건</td>
        <td class="orange">▼${man(p.commission)} <span class="gray" style="font-size:10px">(${pct(p.commission/p.sales)})</span></td>
        <td>≈${fmt(puSet)}</td>
        <td class="red">$${p.cost_usd} · ▼${fmt(puCost)}</td>
        <td class="green bold">${fmt(p.margin)}</td>
        <td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${Math.max(0,mp*100)}%;background:${bclr(mp)}"></div></div><span class="pv" style="color:${bclr(mp)}">${pct(mp)}</span></div></td>
      </tr>`;
    }
    rows+=`<tr class="total-row">
      <td class="left">소계</td><td>${phQ}건</td>
      <td class="orange">▼${man(phC)}</td>
      <td>${fmt(phSet)}</td>
      <td class="red">▼${man(phCost)}</td>
      <td class="green">${fmt(phM)}</td>
      <td class="green">${pct(phMp)}</td>
    </tr>`;

    // warn
    let warn="";
    if(brand==="YDY"){
      const diff=phD.reduce((s,o)=>s+(RATE-1504)*o.cost_usd*o.qty,0);
      warn=`<div class="warn">⚠ 환율 ${RATE.toFixed(0)} 기준 마진율 ${pct(phMp)} — BQ10은 환율 민감${Math.abs(diff)>5000?` (기준 1,504 대비 ${fmt(Math.abs(diff))} ${diff>0?"감소":"증가"})`:""}.</div>`;
    }

    html+=`
    <div class="ph-sub-head">
      <span class="ph-label">💊 ${ph}</span>
      <span style="font-size:11px;color:#6b7280;">${phQ}건 · 정산 ${man(phSet)} · 마진 <strong class="green">${man(phM)}</strong> (${pct(phMp)})</span>
    </div>
    <table>
      <thead><tr>
        <th class="left">상품</th><th>건수</th><th>수수료 (비율)</th>
        <th>건당 정산</th><th>건당 원가</th><th>합계 마진</th><th>마진율</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${warn}`;
  }

  return `<div class="tbl-wrap ph">${html}</div>`;
}

// ── 상시 테이블 ───────────────────────────────────────────────────────────────
function buildSansiTable(sData) {
  const prods={};
  sData.forEach(o=>{
    const k=`${o.channel}__${o.label}`;
    if(!prods[k]) prods[k]={channel:o.channel,label:o.label,qty:0,sales:0,commission:0,settlement:0,cost_krw:0,margin:0,cost_usd:o.cost_usd,comm_basis:o.comm_basis};
    prods[k].qty+=o.qty;prods[k].sales+=o.sales;prods[k].commission+=o.commission;
    prods[k].settlement+=o.settlement;prods[k].cost_krw+=o.cost_krw;prods[k].margin+=o.margin;
    if(o.comm_basis==="est") prods[k].comm_basis="est"; // 하나라도 추정이면 표시
  });

  let rows="";
  for(const p of Object.values(prods).sort((a,b)=>b.settlement-a.settlement)){
    const mp=p.settlement>0?p.margin/p.settlement:0;
    const estBadge=p.comm_basis==="est"?`<span class="est-badge">추정</span>`:"";
    rows+=`<tr>
      <td class="left"><span class="tag ${tagMap[p.channel]||""}">${p.channel}</span> ${p.label}</td>
      <td>${p.qty}건</td>
      <td class="orange">▼${man(p.commission)} <span class="gray" style="font-size:10px">(${pct(p.commission/p.sales)})</span>${estBadge}</td>
      <td>${fmt(p.settlement)}</td>
      <td class="red">$${p.cost_usd} · ▼${man(p.cost_krw)}</td>
      <td class="green bold">${fmt(p.margin)}</td>
      <td><div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${Math.max(0,mp*100)}%;background:${bclr(mp)}"></div></div><span class="pv" style="color:${bclr(mp)}">${pct(mp)}</span></div></td>
    </tr>`;
  }
  const tot=Object.values(prods).reduce((s,p)=>({qty:s.qty+p.qty,commission:s.commission+p.commission,settlement:s.settlement+p.settlement,cost_krw:s.cost_krw+p.cost_krw,margin:s.margin+p.margin}),{qty:0,commission:0,settlement:0,cost_krw:0,margin:0});
  rows+=`<tr class="total-row">
    <td class="left">합계</td><td>${tot.qty}건</td>
    <td class="orange">▼${man(tot.commission)}</td>
    <td>${fmt(tot.settlement)}</td>
    <td class="red">▼${man(tot.cost_krw)}</td>
    <td class="green">${fmt(tot.margin)}</td>
    <td class="green">${tot.settlement>0?pct(tot.margin/tot.settlement):"—"}</td>
  </tr>`;

  const hasEst=sData.some(o=>o.comm_basis==="est");
  const note=hasEst?`<div class="comm-note">
    📌 <strong>수수료 계산 기준</strong><br>
    · 스마트스토어: 파일 실제값 (네이버페이 주문관리 수수료 + 매출연동 수수료)<br>
    · 쿠팡 <span class="est-badge">추정</span>: 식품·건강 기본 8.8% + 결제수수료 2.9% + 부가세 10% = <strong>실질 약 12.9%</strong><br>
    · 11번가 <span class="est-badge">추정</span>: 건강기능식품 카테고리 공식 수수료율 <strong>약 11%</strong>
  </div>`:"";
  return `${note}<div class="tbl-wrap">
    <table>
      <thead><tr>
        <th class="left">채널 · 상품</th><th>건수</th><th>수수료 (비율)</th>
        <th>정산</th><th>원가 (USD · 합계)</th><th>순마진</th><th>마진율</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── Costs ─────────────────────────────────────────────────────────────────────
function renderCosts(){
  let h="";
  for(const c of COST_TABLE){
    const tag=c.brand==="Mylabs"?"tag-ml":"tag-ydy";
    if(c.bq10){const c3=(c.unit*3+c.ship3)*RATE,c6=(c.unit*6+c.ship6)*RATE;h+=`<tr><td><span class="tag ${tag}">${c.brand}</span></td><td>${c.product}</td><td>$${c.unit}/개</td><td>$${c.ship3}(3개)/$${c.ship6}(6개)</td><td class="gray">—</td><td class="gray">—</td><td>3개:${fmt(c3)} / 6개:${fmt(c6)}</td></tr>`;}
    else{const c1=(c.unit+c.ship)*RATE,c2=(c.unit*2+c.ship)*RATE,c3=(c.unit*3+c.ship)*RATE;h+=`<tr><td><span class="tag ${tag}">${c.brand}</span></td><td>${c.product}</td><td>$${c.unit}</td><td>$${c.ship}</td><td>${fmt(c1)}</td><td>${fmt(c2)}</td><td>${fmt(c3)}</td></tr>`;}
  }
  document.getElementById("cost-tbody").innerHTML=h;
}

// ── Tab switch ────────────────────────────────────────────────────────────────
function switchTab(name){
  ["total","mylabs","ydy","costs"].forEach((n,i)=>{
    document.querySelectorAll(".tab")[i].classList.toggle("active",n===name);
    document.getElementById("tab-"+n).classList.toggle("active",n===name);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderPills(); renderAll(); fetchRate();
</script>
